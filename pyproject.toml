[project]
name = "unm-inspector"
version = "0.1.0"
description = "Ferramenta passiva para inspecionar janelas e controles do FiberHome UNM2000."
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6", "pywinauto>=0.6.8", "psutil>=5.9", "Pillow>=10.0"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
line-length = 120
