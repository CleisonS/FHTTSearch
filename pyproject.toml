[project]
name = "unm-inspector"
version = "0.1.0"
description = "Ferramenta passiva para inspecionar janelas e controles do FiberHome UNM2000."
requires-python = ">=3.11,<3.13"
dependencies = [
    "PySide6>=6.6,<6.9",
    "pywinauto>=0.6.8,<0.7",
    "pywin32>=306; platform_system == 'Windows'",
    "psutil>=5.9,<6.2",
    "Pillow>=10.0,<12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
